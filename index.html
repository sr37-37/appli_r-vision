<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Révision</title>
<meta name="theme-color" content="#151516">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Révision">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root {
  --bg0:#0F0F10; --bg1:#151516; --bg2:#1D1D1F; --bg3:#2A2A2C; --bg4:#3A3A3D; --card:#0A0A0B;
  --line:#303033; --t1:#EDEBE7; --t2:#B3B0AB; --t3:#7C7A77; --t4:#55534F;
  --accent:#D8D4CD; --accentDim:#8F8C87; --onAccent:#141415;
  --due:#F1EEE8; --new:#8A8883; --none:#3B3B3E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin:0; background:var(--bg0); color:var(--t1);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
#app { max-width: 780px; margin: 0 auto; min-height: 100vh; display:flex; flex-direction:column; }

/* En-tête */
header { position: sticky; top: 0; z-index: 5; background: var(--bg1); border-bottom: 1px solid var(--line);
  display:flex; align-items:center; gap:6px; padding: 10px 16px; }
header .logo { font-weight: 700; font-size: 18px; margin-right: 14px; }
.tab { padding: 8px 12px; border-radius: 10px; color: var(--t3); font-weight: 600; position: relative; }
.tab:hover { background: var(--bg2); color: var(--t2); }
.tab.on { background: var(--bg3); color: var(--t1); }
.badge { background: var(--accent); color: var(--onAccent); border-radius: 10px; font-size: 12px; font-weight: 700;
  padding: 1px 7px; margin-left: 6px; }
.sp { flex: 1; }
main { padding: 18px 16px 60px; flex: 1; }

/* Boutons */
.primary { background: var(--accent); color: var(--onAccent); padding: 10px 18px; border-radius: 12px; font-weight: 700; }
.primary:hover { background: var(--t1); }
.primary:disabled { opacity: .4; cursor: default; }
.ghost { background: var(--bg2); border: 1px solid var(--line); padding: 9px 14px; border-radius: 12px; color: var(--t1); }
.ghost:hover { background: var(--bg3); }
.danger { color: var(--t2); }
.link { color: var(--accent); padding: 4px 0; }
.link:hover { text-decoration: underline; }

/* Accueil */
.search { width:100%; background: var(--bg2); border:1px solid var(--line); border-radius: 12px; padding: 11px 14px; margin-bottom: 14px; }
.search:focus, textarea:focus, input:focus, select:focus { outline: 2px solid var(--accentDim); outline-offset: 0; }
.section { background: var(--bg3); color: var(--t2); font-size: 12px; font-weight: 700; letter-spacing: .08em;
  padding: 8px 14px; margin-top: 14px; border-radius: 10px 10px 0 0; }
.row { display:flex; align-items:center; gap:14px; padding: 14px; background: var(--card); border-bottom: 1px solid var(--line); cursor:pointer; }
.row:hover { background: var(--bg2); }
.row:last-child { border-radius: 0 0 10px 10px; }
.rowmain { flex:1; min-width:0; }
.name { font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { color: var(--t3); font-size: 14px; margin-top: 3px; }
.badges { width: 120px; text-align:right; font-size: 12px; font-weight: 700; letter-spacing:.04em; }
.badges .d { color: var(--t3); } .badges .d.on { color: var(--due); }
.badges .n { color: var(--new); min-height: 16px; }
.bar { height: 7px; border-radius: 4px; background: var(--none); margin: 4px 0; }
.bar.due { background: var(--due); } .bar.new { background: var(--new); }
.empty { text-align:center; color: var(--t3); padding: 70px 20px; }
.empty h2 { color: var(--t1); margin: 10px 0 6px; }

/* Titres de page */
.pagehead { display:flex; align-items:center; gap:10px; margin-bottom: 8px; }
.pagehead h1 { font-size: 26px; margin: 0; flex: 1; min-width: 0; overflow:hidden; text-overflow: ellipsis; }
h2.sub { font-size: 22px; margin: 28px 0 12px; display:flex; align-items:center; gap:12px; }
.seg { display:inline-flex; background: var(--bg2); border-radius: 12px; padding: 3px; margin-left:auto; }
.seg button { padding: 6px 12px; border-radius: 9px; color: var(--t3); font-weight:600; font-size: 14px; }
.seg button.on { background: var(--bg4); color: var(--t1); }

/* Graphique */
.chart { padding-top: 22px; }
.plot { position: relative; height: 180px; margin-left: 36px; }
.gl { position:absolute; left:0; right:0; border-top: 1px solid var(--line); }
.gl span { position:absolute; left:-36px; top:-10px; width:28px; text-align:right; color: var(--t3); font-size: 13px; }
.bars { position:absolute; inset:0; display:flex; align-items:flex-end; }
.col { flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; }
.col .val { font-weight: 600; font-size: 16px; margin-bottom: 3px; min-height: 0; }
.col .b { width: 58%; background: var(--accentDim); border-radius: 6px 6px 0 0; }
.col .b.hl { background: var(--due); }
.col .b.zero { background: var(--bg4); }
.labels { display:flex; margin-left: 36px; margin-top: 8px; }
.labels div { flex:1; text-align:center; color: var(--t2); font-size: 13px; }
.labels small { display:block; color: var(--t3); }

/* Cartes */
.grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow:hidden; cursor:pointer; min-height: 150px; display:flex; flex-direction:column; }
.tile:hover { border-color: var(--accentDim); }
.tile .th { background: var(--bg4); color: var(--t2); font-size: 12px; font-weight:700; padding: 5px 10px; letter-spacing: .04em; }
.tile.due .th { background: var(--due); color: var(--onAccent); }
.tile .tb { flex:1; display:flex; align-items:center; justify-content:center; text-align:center; padding: 12px; overflow:hidden; word-break: break-word; }
.plus { width: 40px; height: 40px; border-radius: 12px; background: var(--bg2); border: 1px solid var(--line); font-size: 24px; line-height: 1; color: var(--accent); }
.plus:hover { background: var(--bg3); }
.cta { display:flex; align-items:center; gap: 12px; width:100%; margin-top: 26px; padding: 18px 20px; border-radius: 18px;
  background: var(--bg2); border: 1px solid var(--line); font-size: 20px; font-weight: 700; color: var(--accent); text-align:left; }
.cta:hover { background: var(--bg3); }
.cta:disabled { opacity: .45; cursor: default; }

/* Stats / Plan */
.tiles { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--bg2); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.stat b { display:block; font-size: 32px; }
.stat span { color: var(--t3); font-size: 14px; }
.stat.strong { background: var(--bg3); border-color: var(--accentDim); }
.box { background: var(--bg2); border-radius: 16px; padding: 16px; margin-top: 8px; }
.lines div { display:flex; justify-content:space-between; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.lines div:last-child { border: 0; }
.chips { display:flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.chip { background: var(--bg4); border-radius: 12px; padding: 6px 12px; font-weight: 600; font-size: 14px; }
.chip.dim { background: transparent; color: var(--t3); }
.muted { color: var(--t3); font-size: 14px; }
.btnrow { display:flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }

/* Fenêtres */
.overlay { position: fixed; inset: 0; background: rgba(5,5,6,.72); display:flex; align-items:center; justify-content:center; padding: 16px; z-index: 20; }
.modal { background: var(--bg1); border: 1px solid var(--line); border-radius: 20px; padding: 22px; width: 100%; max-width: 520px; max-height: 92vh; overflow:auto; }
.modal h2 { margin: 0 0 14px; font-size: 22px; }
.modal label { display:block; color: var(--t3); font-size: 13px; font-weight: 700; letter-spacing:.04em; margin: 12px 0 5px; text-transform: uppercase; }
.modal textarea, .modal input, .modal select { width: 100%; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; }
.modal textarea { resize: vertical; min-height: 96px; }
.actions { display:flex; gap: 10px; align-items:center; margin-top: 20px; }

/* Révision */
.review { width: 100%; max-width: 780px; margin: 0 auto; min-height: 100vh; display:flex; flex-direction:column; padding: 14px 16px 20px; }
.rtop { display:flex; align-items:center; gap: 12px; margin-bottom: 10px; }
.rtop .count { flex:1; text-align:center; font-weight: 700; }
.progress { height: 4px; background: var(--bg3); border-radius: 2px; overflow:hidden; margin-bottom: 14px; }
.progress div { height:100%; background: var(--accent); }
.rcard { flex:1; background: var(--card); border: 1px solid var(--line); border-radius: 20px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 28px; text-align:center; font-size: 28px; line-height: 1.35; cursor:pointer; min-height: 320px; word-break: break-word; white-space: pre-wrap; }
.rcard hr { border:0; border-top: 1px solid var(--line); align-self: stretch; margin: 26px 0; }
.answers { display:flex; gap: 12px; margin-top: 14px; }
.answers button { flex:1; border-radius: 18px; padding: 14px; font-size: 19px; font-weight: 700; }
.answers small { display:block; font-size: 13px; font-weight: 500; margin-top: 3px; }
.answers .no { background: var(--bg2); border: 1px solid var(--line); }
.answers .no small { color: var(--t3); }
.answers .yes { background: var(--accent); color: var(--onAccent); }
.answers .yes small { color: var(--bg4); }
.big { width:100%; margin-top: 14px; padding: 18px; border-radius: 18px; font-size: 20px; }
kbd { background: var(--bg3); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; font-size: 12px; color: var(--t2); }
.done { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap: 8px; }
.done h2 { font-size: 30px; margin: 0; }

.section.flex { display:flex; justify-content:space-between; align-items:center; }
.mini { background: var(--bg4); color: var(--t1); border-radius: 8px; padding: 3px 10px; font-size: 12px; font-weight: 700; letter-spacing: 0; }
.mini:hover { background: var(--accentDim); color: var(--onAccent); }
.list { border-radius: 10px; overflow: hidden; }
.row .plus { flex: none; }
.x { flex: none; padding: 6px 10px; border-radius: 10px; color: var(--t3); font-size: 15px; }
.x:hover { background: var(--bg3); color: var(--t1); }
.picklist { max-height: 50vh; overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--bg2); }
.modal .pick { display:flex; align-items:center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 17px; margin: 0; color: var(--t1); text-transform: none; letter-spacing: 0; font-weight: 400; }
.modal .pick:last-child { border-bottom: 0; }
.modal .pick input { width: 20px; height: 20px; padding: 0; accent-color: #D8D4CD; flex: none; }
.lab { display:block; color: var(--t3); font-size: 12px; font-weight: 700; letter-spacing:.05em; text-transform: uppercase; margin: 10px 0 5px; }
.inp { width:100%; background: var(--bg1); border:1px solid var(--line); border-radius: 12px; padding: 11px 13px; }
.err { color: var(--t1); font-weight: 600; margin: 12px 0 0; }
.syncstat { color: var(--t3); font-size: 13px; margin-right: 8px; white-space: nowrap; }
@media (max-width: 560px) {
  header .logo { display:none; }
  .syncstat { display:none; }
  .badges { width: 100px; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>

<script>
'use strict';

/* ========== Calendrier de révision (courbe d'Ebbinghaus) ==========
   Semaine 1 : J1 x2 (la 2e ~3 h après), J2, J3, J5, J7 (rien les J4 et J6).
   Ensuite : semaines 3, 5, 8, 12, 16. Après la révision de la semaine 16, la carte est
   terminée ; un deck dont toutes les cartes sont terminées va dans le dossier « Semaine +16 ».
   Pour modifier le calendrier, il suffit de changer WEEK1 et WEEKS ci-dessous. */
const DAY = 864e5, HOUR = 36e5, GAP = 3 * HOUR;
const WEEK1 = [0, 0, 1, 2, 4, 6];               // décalage en jours depuis J1 (J1, J1, J2, J3, J5, J7)
const WEEKS = [3, 5, 8, 12, 16];                // semaines des révisions suivantes
const TOTAL = WEEK1.length + WEEKS.length;      // nombre total de révisions d'une carte (11)
const FOLDER = 'Semaine +16';

const sod = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const addDays = (s, n) => { const d = new Date(s); d.setDate(d.getDate() + n); return d.getTime(); };
function offsetFor(i) {
  if (i < WEEK1.length) return WEEK1[i];
  return (WEEKS[i - WEEK1.length] - 1) * 7;       // la semaine n commence au jour (n-1)*7 après J1
}
const weekFor = (i) => Math.floor(offsetFor(i) / 7) + 1;
const dueFor = (i, start, now) => (offsetFor(i) === 0 ? now + GAP : addDays(start, offsetFor(i)));
const isNew = (c) => !c.done && c.due == null;
const isDue = (c, n) => !c.done && c.due != null && c.due <= n;
function answer(c, knew, now) {
  if (!knew) {                                    // oubli : la révision n'est pas comptée, la carte garde son étape et revient demain
    return { ...c, due: addDays(sod(now), 1), retry: true, lastReview: now, u: now };
  }
  const s = c.startDay == null ? sod(now) : c.startDay;
  const step = c.step + 1;
  if (step >= TOTAL) return { ...c, step, startDay: s, due: null, done: true, retry: false, lastReview: now, u: now };   // terminée
  let due = dueFor(step, s, now);
  // Après un oubli, le calendrier reste celui de départ, mais on évite de redonner la carte le jour même d'une révision réussie.
  if (c.retry && offsetFor(step) !== 0) due = Math.max(due, addDays(sod(now), 1));
  return { ...c, step, startDay: s, due, retry: false, lastReview: now, u: now };
}
function formatIn(ts, now) {
  const diff = ts - now;
  if (diff <= 0) return 'maintenant';
  if (diff < HOUR) return `dans ${Math.max(1, Math.round(diff / 6e4))} min`;
  const days = Math.round((sod(ts) - sod(now)) / DAY);
  if (days <= 0) return `dans ${Math.round(diff / HOUR)} h`;
  if (days === 1) return 'demain';
  if (days < 14) return `dans ${days} j`;
  return `dans ${Math.round(days / 7)} sem.`;
}
function formatAgo(ts, now) {
  if (!ts) return '—';
  const d = now - ts;
  if (d < HOUR) return `${Math.max(1, Math.round(d / 6e4))} min`;
  if (d < DAY) return `${Math.round(d / HOUR)} h`;
  return `${Math.round(d / DAY)} j`;
}
function planLabels(n) {
  return Array.from({ length: n }, (_, i) => (offsetFor(i) < 7 ? `J${offsetFor(i) + 1}` : `Semaine ${weekFor(i)}`));
}

/* ========== Données (sauvegardées dans le navigateur) ========== */
const KEY = 'revision-app/v1';
const blank = () => ({ decks: [], cards: [], folders: [], log: [], tomb: {} });
let data = load();
function load() {
  let d = blank();
  try { const x = JSON.parse(localStorage.getItem(KEY)); if (x) d = { ...d, ...x }; } catch (e) {}
  return migrate(d);
}
// "u" = date de dernière modification d'un deck ou d'une carte (sert à la synchronisation : le plus récent gagne).
// "tomb" = éléments supprimés, gardés en mémoire pour que la suppression se propage aux autres appareils.
function migrate(d) {
  const t = Date.now();
  if (!d.tomb) d.tomb = {};
  if (!d.folders) d.folders = [];
  d.cards = d.cards.filter((c) => typeof c.front === 'string');   // écarte d'éventuels éléments étrangers reçus d'une ancienne version
  d.folders.forEach((x) => { if (!x.u) x.u = x.createdAt || t; if (!x.deckIds) x.deckIds = []; });
  d.decks.forEach((x) => { if (!x.u) x.u = x.updatedAt || x.createdAt || t; });
  d.cards.forEach((x) => { if (!x.u) x.u = x.lastReview || x.createdAt || t; });
  d.log.forEach((l) => { if (!l.id) l.id = 'l_' + l.t + '_' + l.cardId; });
  return d;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} scheduleSync(); }
function tombstone(kind, id) { data.tomb[id] = { kind, u: Date.now() }; }
// Remplace toutes les données (import, effacement) en laissant des tombes pour ce qui disparaît.
function replaceAll(next) {
  next = migrate(next);
  const t = Date.now(), keep = new Set([...next.decks, ...next.cards, ...next.folders, ...next.log].map((x) => x.id)), tomb = {};
  const mark = (kind, list) => list.forEach((x) => { if (!keep.has(x.id)) tomb[x.id] = { kind, u: t }; });
  mark('deck', data.decks); mark('card', data.cards); mark('folder', data.folders); mark('log', data.log);
  for (const [id, v] of Object.entries(data.tomb)) if (!keep.has(id) && !tomb[id]) tomb[id] = v;
  next.decks.forEach((x) => (x.u = t)); next.cards.forEach((x) => (x.u = t)); next.folders.forEach((x) => (x.u = t));
  next.tomb = tomb; data = next; save();
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => Date.now();

function stats(deckId) {
  const t = now();
  let total = 0, due = 0, fresh = 0, done = 0, last = null;
  for (const c of data.cards) {
    if (deckId && c.deckId !== deckId) continue;
    total++;
    if (c.done) done++; else if (isNew(c)) fresh++; else if (isDue(c, t)) due++;
    if (c.lastReview && (!last || c.lastReview > last)) last = c.lastReview;
  }
  return { total, due, new: fresh, done, last };
}
// Un deck est "terminé" quand toutes ses cartes ont fini le calendrier -> dossier « Semaine +16 ».
function isComplete(deckId) { const s = stats(deckId); return s.total > 0 && s.done === s.total; }
function queueFor(deckId, deckSet) {
  const t = now();
  const cs = data.cards.filter((c) => (!deckId || c.deckId === deckId) && (!deckSet || deckSet.has(c.deckId)));
  const due = cs.filter((c) => isDue(c, t)).sort((a, b) => a.due - b.due);
  const fresh = cs.filter(isNew).sort((a, b) => a.createdAt - b.createdAt);
  return shuffle([...due, ...fresh].map((c) => c.id));   // ordre aléatoire à chaque séance
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ========== Utilitaires d'affichage ========== */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n, a, b) => (n > 1 ? b : a);
const DAYS = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'];

function chart(items) {
  const max = Math.max(5, ...items.map((d) => d.value));
  const step = Math.ceil(max / 5), top = step * 5;
  const grid = [0, 1, 2, 3, 4, 5].map((i) => `<div class="gl" style="bottom:${((i * step) / top) * 100}%"><span>${i * step}</span></div>`).join('');
  const bars = items.map((d) => `<div class="col">${d.value ? `<div class="val">${d.value}</div>` : ''}<div class="b ${d.hl ? 'hl' : ''} ${d.value ? '' : 'zero'}" style="height:${d.value ? Math.max(3, (d.value / top) * 92) : 1.5}%"></div></div>`).join('');
  const labels = items.map((d) => `<div>${d.label}${d.sub ? `<small>${d.sub}</small>` : ''}</div>`).join('');
  return `<div class="chart"><div class="plot">${grid}<div class="bars">${bars}</div></div><div class="labels">${labels}</div></div>`;
}

/* ========== État de l'interface ========== */
const ui = { tab: 'home', deckId: null, folderId: null, q: '', chartMode: 'dist', review: null };

function setView(tab, deckId = null) { ui.tab = tab; ui.deckId = deckId; ui.review = null; render(); window.scrollTo(0, 0); }

/* ========== Rendu ========== */
function render() {
  const root = $('#app');
  if (ui.review) { root.innerHTML = reviewView(); return; }
  const due = stats().due;
  const tab = (key, label, extra = '') => `<button class="tab ${ui.tab === key || (key === 'home' && (ui.tab === 'deck' || ui.tab === 'folder' || ui.tab === 'ufolder')) ? 'on' : ''}" data-act="tab" data-id="${key}">${label}${extra}</button>`;
  root.innerHTML = `
    <header>
      <span class="logo">Révision</span>
      ${tab('home', 'Accueil')}${tab('stats', 'Stats')}
      ${tab('review', 'Révision', due ? `<span class="badge">${due}</span>` : '')}
      ${tab('plan', 'Plan & données')}
      <span class="sp"></span>
      <span class="syncstat" id="syncstat">${syncLabel()}</span>
      ${ui.tab === 'home' ? '<button class="primary" data-act="deck-new">+ Nouveau deck</button>' : ''}
    </header>
    <main>${ui.tab === 'home' ? homeView() : ui.tab === 'deck' ? deckView() : ui.tab === 'folder' ? folderView() : ui.tab === 'ufolder' ? ufolderView() : ui.tab === 'stats' ? statsView() : ui.tab === 'review' ? reviewTabView() : planView()}</main>`;
}

function deckRow(d, fid) {
  const st = stats(d.id), t = now();
  return `<div class="row" data-act="deck-open" data-id="${d.id}">
    <div class="rowmain"><div class="name">${esc(d.name)}</div>

const folderIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" style="vertical-align:-3px;margin-right:8px"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';

/* ========== Dossiers et sous-dossiers ==========
   Un dossier regroupe des decks. Un deck peut être dans plusieurs dossiers et reste aussi dans la liste de l'accueil.
   Un sous-dossier ne peut recevoir que des decks déjà présents dans son dossier parent. */
const byName = (a, b) => a.name.localeCompare(b.name, 'fr');
const fById = (id) => data.folders.find((f) => f.id === id);
const isRoot = (f) => !f.parentId || !fById(f.parentId);      // un dossier dont le parent a disparu remonte à l'accueil
const kids = (id) => data.folders.filter((f) => f.parentId === id).sort(byName);
function descendants(id) { const out = []; for (const k of kids(id)) out.push(k.id, ...descendants(k.id)); return out; }
const folderDecks = (f) => f.deckIds.map((id) => data.decks.find((d) => d.id === id)).filter(Boolean).sort(byName);
function folderDeckSet(id) {
  const ids = new Set();
  for (const x of [id, ...descendants(id)]) { const f = fById(x); if (f) f.deckIds.forEach((d) => ids.add(d)); }
  return new Set([...ids].filter((d) => data.decks.some((k) => k.id === d)));
}
function addableDecks(f) {
  const parent = f.parentId ? fById(f.parentId) : null;
  const pool = f.parentId ? (parent ? folderDecks(parent) : []) : data.decks;
  return pool.filter((d) => !f.deckIds.includes(d.id)).sort(byName);
}
function setFolders(ids, fn) { const t = now(); data.folders = data.folders.map((f) => (ids.includes(f.id) ? { ...f, ...fn(f), u: t } : f)); }
function createFolder(name, parentId) {
  const t = now(), f = { id: uid(), name: name.trim() || 'Nouveau dossier', parentId: parentId || null, deckIds: [], createdAt: t, u: t };
  data.folders.push(f); save(); return f;
}
// Retirer un deck d'un dossier le retire aussi de tous ses sous-dossiers.
function removeFromFolder(fid, deckId) { setFolders([fid, ...descendants(fid)], (f) => ({ deckIds: f.deckIds.filter((x) => x !== deckId) })); save(); }
function untrackDeck(deckId) { setFolders(data.folders.filter((f) => f.deckIds.includes(deckId)).map((f) => f.id), (f) => ({ deckIds: f.deckIds.filter((x) => x !== deckId) })); }
function deleteFolder(id) {
  const gone = new Set([id, ...descendants(id)]);
  gone.forEach((x) => tombstone('folder', x));
  data.folders = data.folders.filter((f) => !gone.has(f.id)); save();
}
function openFolder(id) { ui.folderId = id; setView('ufolder'); }

function folderRow(f) {
  const decks = folderDecks(f), due = decks.reduce((n, d) => n + stats(d.id).due, 0), ns = kids(f.id).length;
  return `<div class="row" data-act="ufolder-open" data-id="${f.id}"><div class="rowmain"><div class="name">${folderIcon}${esc(f.name)}</div>
    <div class="meta">${decks.length} ${plural(decks.length, 'deck', 'decks')}${ns ? ` · ${ns} ${plural(ns, 'sous-dossier', 'sous-dossiers')}` : ''}</div></div>
    <div class="badges"><div class="d ${due ? 'on' : ''}">${due} À FAIRE</div></div>
    <button class="plus" data-act="folder-add" data-id="${f.id}" title="Ajouter des decks à ce dossier" aria-label="Ajouter des decks">+</button></div>`;
}
function ufolderView() {
  const f = fById(ui.folderId);
  if (!f) { ui.tab = 'home'; return homeView(); }
  const parent = f.parentId ? fById(f.parentId) : null, subs = kids(f.id), decks = folderDecks(f);

    <button class="cta" style="margin:6px 0 4px" data-act="folder-review" data-id="${f.id}" ${nRev ? '' : 'disabled'}>▶ ${nRev ? `Réviser ${nRev} ${plural(nRev, 'carte', 'cartes')}` : 'Rien à réviser'}</button>
    <h2 class="sub">Decks <button class="plus" data-act="folder-add" data-id="${f.id}" title="Ajouter des decks" aria-label="Ajouter des decks">+</button>
      <span class="muted" style="margin-left:auto">${decks.length}</span></h2>
    ${parent ? `<p class="muted" style="margin:-4px 0 10px">Dans un sous-dossier, tu peux seulement ajouter des decks déjà présents dans « ${esc(parent.name)} ».</p>` : ''}
    ${decks.length ? `<div class="list">${decks.map((d) => deckRow(d, f.id)).join('')}</div>` : '<p class="muted">Aucun deck dans ce dossier. Clique sur + pour en ajouter.</p>'}
    <h2 class="sub">Sous-dossiers <button class="ghost" data-act="subfolder-new" style="margin-left:auto;font-size:14px;padding:7px 12px">+ Sous-dossier</button></h2>

function deckView() {
  const d = data.decks.find((x) => x.id === ui.deckId);

  const t = now(), cs = data.cards.filter((c) => c.deckId === d.id), st = stats(d.id);
  let items;
  if (ui.chartMode === 'dist') {
    const b = [0, 0, 0, 0, 0, 0];
    for (const c of cs) {
      if (c.done) continue;
      if (isNew(c)) b[0]++; else if (c.due <= t) b[1]++;
      else { const x = c.due - t; if (x < DAY) b[2]++; else if (x < 7 * DAY) b[3]++; else if (x < 30 * DAY) b[4]++; else b[5]++; }
    }
    const names = ['Neuves', 'Maintenant', '< 24 h', '< 1 sem.', '< 30 j', '30 j +'];
    items = b.map((v, i) => ({ label: names[i], sub: `${Math.round((v / (cs.length || 1)) * 100)} %`, value: v, hl: i === 1 }));
  } else {
    const c7 = [0, 0, 0, 0, 0, 0, 0], today = sod(t);
    for (const c of cs) {
      if (c.done || isNew(c)) continue;
      const i = isDue(c, t) ? 0 : Math.round((sod(c.due) - today) / DAY);
      if (i >= 0 && i < 7) c7[i]++;
    }
    items = c7.map((v, i) => ({ label: i === 0 ? 'Auj.' : DAYS[(new Date(today).getDay() + i) % 7], value: v, hl: i === 0 }));

    ${chart(items)}

      <span class="muted" style="margin-left:auto">${cs.length}</span></h2>
    ${cs.length ? `<div class="grid">${cs.map((c) => `
      <div class="tile ${isDue(c, t) ? 'due' : ''}" data-act="card-edit" data-id="${c.id}">
        <div class="th">${c.done ? 'TERMINÉE' : isNew(c) ? 'NEUVE' : isDue(c, t) ? 'À RÉVISER' : formatIn(c.due, t).toUpperCase()}</div>
        <div class="tb">${esc(c.front)}</div></div>`).join('')}</div>` : '<p class="muted">Aucune carte. Clique sur + pour en ajouter.</p>'}
    <button class="cta" data-act="review-start" data-id="${d.id}" ${n ? '' : 'disabled'}>▶ ${n ? `Réviser ${n} ${plural(n, 'carte', 'cartes')}` : 'Rien à réviser'}</button>`;
}

function statsView() {
  const t = now(), today = sod(t), st = stats();
  const week = [0, 0, 0, 0, 0, 0, 0];
  for (const l of data.log) { const i = 6 - Math.round((today - sod(l.t)) / DAY); if (i >= 0 && i < 7) week[i]++; }
  const items = week.map((v, i) => ({ label: i === 6 ? 'Auj.' : DAYS[new Date(today - (6 - i) * DAY).getDay()], value: v, hl: i === 6 }));
  const forgot = data.log.filter((l) => !l.knew).length;
  const rate = data.log.length ? Math.round(((data.log.length - forgot) / data.log.length) * 100) + ' %' : '—';
  const first = data.cards.filter((c) => !c.done && !isNew(c) && c.step < WEEK1.length).length;
  const long = data.cards.filter((c) => !c.done && c.step >= WEEK1.length).length;

function reviewView() {

function saveCard(more) {
  const front = $('#m-front').value.trim(), back = $('#m-back').value.trim(), deckId = $('#m-deck').value;
  if (!front) { $('#m-front').focus(); return; }
  const t = now();
  if (cardModal.id) data.cards = data.cards.map((c) => (c.id === cardModal.id ? { ...c, front, back, deckId, u: t } : c));
  else data.cards.push({ id: uid(), deckId, front, back, createdAt: t, step: 0, startDay: null, due: null, lastReview: null, u: t });
  data.decks = data.decks.map((d) => (d.id === deckId ? { ...d, updatedAt: t, u: t } : d));
  save();
  if (more && !cardModal.id) { cardModal(null, deckId); render(); } else { closeModal(); render(); }
}

/* ========== Actions ========== */
function startReview(deckId, deckSet) {
  ui.review = { queue: queueFor(deckId, deckSet), i: 0, flipped: false, known: 0, forgot: 0 };
  render(); window.scrollTo(0, 0);
}
function reply(knew) {
  const r = ui.review, id = r.queue[r.i], t = now();
  data.cards = data.cards.map((c) => (c.id === id ? answer(c, knew, t) : c));
  data.log.push({ id: 'l_' + t + '_' + id, t, cardId: id, knew }); if (data.log.length > 5000) data.log = data.log.slice(-5000);
  save();
  r.known += knew ? 1 : 0; r.forgot += knew ? 0 : 1; r.i++; r.flipped = false; render();
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'overlay') { if (e.target === el) closeModal(); return; }
  switch (act) {
    case 'tab': setView(id); break;
    case 'deck-open': setView('deck', id); break;
    case 'folder-open': setView('folder'); break;
    case 'deck-new':
      askText('Nouveau deck', 'Mon deck', 'Créer', (name) => {
        const t = now(); const d = { id: uid(), name: name.trim() || 'Mon deck', createdAt: t, updatedAt: t, u: t };
        data.decks.push(d); save(); closeModal(); setView('deck', d.id);
      }); break;
    case 'deck-rename': {
      const d = data.decks.find((x) => x.id === ui.deckId);
      askText('Renommer le deck', d.name, 'Renommer', (name) => {
        if (name.trim()) { d.name = name.trim(); d.updatedAt = d.u = now(); save(); }
        closeModal(); render();
      }); break; }
    case 'deck-del': {
      const d = data.decks.find((x) => x.id === ui.deckId), n = data.cards.filter((c) => c.deckId === d.id).length;
      confirmBox('Supprimer ce deck ?', `Le deck « ${d.name} » et ses ${n} cartes seront supprimés.`, 'Supprimer', () => {
        data.cards.filter((c) => c.deckId === d.id).forEach((c) => tombstone('card', c.id)); tombstone('deck', d.id); untrackDeck(d.id);
        data.decks = data.decks.filter((x) => x.id !== d.id); data.cards = data.cards.filter((c) => c.deckId !== d.id);
        save(); closeModal(); setView('home');
      }); break; }
    case 'folder-new': askText('Nouveau dossier', '', 'Créer', (name) => { if (!name.trim()) return; createFolder(name, null); closeModal(); render(); }); break;
    case 'subfolder-new': askText('Nouveau sous-dossier', '', 'Créer', (name) => { if (!name.trim()) return; createFolder(name, ui.folderId); closeModal(); render(); }); break;
    case 'ufolder-open': openFolder(id); break;
    case 'folder-up': { const f = fById(ui.folderId), p = f && f.parentId && fById(f.parentId); if (p) openFolder(p.id); else setView('home'); break; }
    case 'folder-add': addDecksModal(id); break;
    case 'folder-add-ok': {
      const f = fById(id), allowed = new Set(addableDecks(f).map((d) => d.id));
      const ids = [...document.querySelectorAll('.cb-deck:checked')].map((x) => x.value).filter((x) => allowed.has(x));
      if (ids.length) { setFolders([id], (g) => ({ deckIds: [...g.deckIds, ...ids] })); save(); }
      closeModal(); render(); break; }
    case 'folder-review': startReview(null, folderDeckSet(id)); break;
    case 'folder-remove': removeFromFolder(el.dataset.f, id); render(); break;
    case 'folder-rename': {
      const f = fById(ui.folderId);
      askText('Renommer le dossier', f.name, 'Renommer', (name) => { if (name.trim()) { setFolders([f.id], () => ({ name: name.trim() })); save(); } closeModal(); render(); }); break; }
    case 'folder-del': {
      const f = fById(ui.folderId), n = descendants(f.id).length;
      confirmBox('Supprimer ce dossier ?', `Le dossier « ${f.name} »${n ? ` et ses ${n} ${plural(n, 'sous-dossier', 'sous-dossiers')}` : ''} sera supprimé. Les decks et les cartes ne sont pas supprimés.`, 'Supprimer', () => {
        const parentId = f.parentId; deleteFolder(f.id); closeModal();
        const p = parentId && fById(parentId); if (p) openFolder(p.id); else setView('home');
      }); break; }
    case 'sync-login': doAuth('login'); break;
    case 'sync-signup': doAuth('signup'); break;
    case 'sync-reset': doReset(); break;
    case 'sync-now': syncNow(); break;
    case 'sync-logout': if (remote) remote.signOut(); break;
    case 'chart': ui.chartMode = id; render(); break;
    case 'card-new':
      if (!data.decks.length) { confirmBox('Aucun deck', 'Crée d’abord un deck pour y ajouter des cartes.', 'OK', closeModal); break; }
      cardModal(null, ui.deckId); break;
    case 'card-edit': cardModal(id); break;
    case 'card-save': saveCard(false); break;
    case 'card-save-more': saveCard(true); break;
    case 'card-del':
      confirmBox('Supprimer cette carte ?', 'Cette action est définitive.', 'Supprimer', () => {
        tombstone('card', cardModal.id); data.cards = data.cards.filter((c) => c.id !== cardModal.id); save(); closeModal(); render();
      }); break;
    case 'm-ok': { const inp = $('#m-text'); askText.cb && askText.cb(inp ? inp.value : ''); break; }
    case 'close': closeModal(); break;
    case 'review-start': startReview(id || null); break;
    case 'review-quit': ui.review = null; render(); break;
    case 'flip': if (ui.review) { ui.review.flipped = !ui.review.flipped; render(); } break;
    case 'yes': reply(true); break;
    case 'no': reply(false); break;
    case 'export': {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
      a.download = `revision-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`; a.click(); break; }
    case 'import': $('#file').click(); break;
    case 'reset':
      confirmBox('Tout effacer ?', syncUser ? 'Tous les decks, cartes et statistiques seront supprimés ici ET sur tous tes appareils connectés au compte.' : 'Tous les decks, cartes et statistiques seront supprimés de ce navigateur.', 'Tout effacer', () => {
        replaceAll(blank()); closeModal(); setView('home');
      }); break;
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { ui.q = e.target.value; $('#list').innerHTML = homeList(); }
});
document.addEventListener('change', (e) => {
  if (e.target.id !== 'file' || !e.target.files[0]) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!Array.isArray(d.decks) || !Array.isArray(d.cards)) throw new Error();
      confirmBox('Importer cette sauvegarde ?', `${d.decks.length} decks et ${d.cards.length} cartes. Les données actuelles seront remplacées${syncUser ? ' (sur tous tes appareils connectés)' : ''}.`, 'Importer', () => {
        replaceAll({ ...blank(), ...d }); closeModal(); setView('home');
      });
    } catch (err) { confirmBox('Fichier invalide', 'Ce fichier n’est pas une sauvegarde de Révision.', 'OK', closeModal); }
  };
  rd.readAsText(e.target.files[0]);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.target.id === 's-pass' || e.target.id === 's-email')) { e.preventDefault(); doAuth('login'); return; }
  if (modalOpen()) {
    if (e.key === 'Escape') closeModal();
    else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && $('#m-front')) saveCard(!cardModal.id);
    else if (e.key === 'Enter' && $('#m-text') && e.target.id === 'm-text') { e.preventDefault(); askText.cb && askText.cb($('#m-text').value); }
    return;
  }
  const r = ui.review;
  if (!r) return;
  if (e.key === 'Escape') { ui.review = null; render(); return; }
  const done = r.i >= r.queue.length;
  if (done) { if (e.key === 'Enter' || e.key === ' ') { ui.review = null; render(); } return; }
  if (!r.flipped) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); r.flipped = true; render(); } }
  else if (e.key === '1' || e.key === 'ArrowLeft') reply(false);
  else if (e.key === '2' || e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); reply(true); }
});

// Mode hors connexion (seulement quand le site est en ligne, pas en ouvrant le fichier directement)
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}


/* ========== Synchronisation (facultative) ==========
   Les cartes restent d'abord dans le navigateur (l'application marche sans internet). Quand tu es connecté à ton
   compte, les changements sont envoyés puis ceux des autres appareils sont récupérés. Pour chaque deck ou carte,
   la modification la plus récente gagne. Pour activer : remplir FIREBASE_CONFIG (voir le guide). */
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyAp6sOQoGbM-xpT16INw49nXLQ9XT4J_a4',
  authDomain: 'revision-e546f.firebaseapp.com',
  projectId: 'revision-e546f',
  storageBucket: 'revision-e546f.firebasestorage.app',
  messagingSenderId: '138646876486',
  appId: '1:138646876486:web:2c6c94c29e14168820f547',
};
const SYNC_KEY = 'revision-app/sync-';
let remote = null, syncUser = null, syncSt = null, syncStatus = 'idle', syncMsg = '', syncTimer = null, syncing = false, syncAgain = false;
const syncOn = () => !!(window.__REMOTE_FACTORY__ || FIREBASE_CONFIG.apiKey);
const typing = () => !!document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
const emptySt = () => ({ seen: {}, cursor: 0, last: 0 });   // seen[id] = dernière version connue du serveur
function loadSt(uid) {
  let st; try { st = { ...emptySt(), ...JSON.parse(localStorage.getItem(SYNC_KEY + uid)) }; } catch (e) { st = emptySt(); }
  if (st.v !== 2) { st.v = 2; st.cursor = 0; }      // version 2 (dossiers) : on relit tout une fois, sans rien écraser
  return st;
}
function saveSt() { try { if (syncUser) localStorage.setItem(SYNC_KEY + syncUser.uid, JSON.stringify(syncSt)); } catch (e) {} }

async function firebaseRemote(cfg) {
  const base = 'https://www.gstatic.com/firebasejs/10.14.1/';
  const [{ initializeApp }, A, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = initializeApp(cfg), auth = A.getAuth(app), db = F.getFirestore(app);
  return {
    onAuth: (cb) => A.onAuthStateChanged(auth, (u) => cb(u ? { uid: u.uid, email: u.email } : null)),
    signIn: (e, p) => A.signInWithEmailAndPassword(auth, e, p),
    signUp: (e, p) => A.createUserWithEmailAndPassword(auth, e, p),
    reset: (e) => A.sendPasswordResetEmail(auth, e),
    signOut: () => A.signOut(auth),
    async push(uid, items) {
      for (let i = 0; i < items.length; i += 400) {
        const b = F.writeBatch(db);
        for (const it of items.slice(i, i + 400)) b.set(F.doc(db, 'users', uid, 'items', it.id), { ...it, s: F.serverTimestamp() });
        await b.commit();
      }
    },
    async pull(uid, since) {
      const q = F.query(F.collection(db, 'users', uid, 'items'), F.where('s', '>', F.Timestamp.fromMillis(Math.max(0, since - 5000))));
      const snap = await F.getDocs(q), items = []; let cursor = since;
      snap.forEach((d) => { const x = d.data(); if (x.s && x.s.toMillis) cursor = Math.max(cursor, x.s.toMillis()); delete x.s; items.push(x); });
      return { items, cursor };
    },
  };
}

// Ce qui a changé ici depuis la dernière version connue du serveur.
function dirtyItems() {
  const seen = syncSt.seen, out = [];
  for (const d of data.decks) if (seen[d.id] !== d.u) out.push({ kind: 'deck', ...d });
  for (const c of data.cards) if (seen[c.id] !== c.u) out.push({ kind: 'card', ...c });
  for (const f of data.folders) if (seen[f.id] !== f.u) out.push({ kind: 'folder', ...f });
  for (const [id, t] of Object.entries(data.tomb)) if (seen[id] !== t.u) out.push({ id, kind: t.kind, deleted: true, u: t.u });
  for (const l of data.log) if (!seen[l.id]) out.push({ kind: 'log', ...l, u: l.t });
  return JSON.parse(JSON.stringify(out));
}
// Intègre ce que les autres appareils ont envoyé (le plus récent gagne).
function mergeIn(items) {
  const seen = syncSt.seen; let changed = false;
  const logIds = new Set(data.log.map((l) => l.id));
  for (const r of items) {
    if (r.kind === 'log') {
      seen[r.id] = r.deleted ? r.u : true;
      if (r.deleted) {
        if (logIds.has(r.id)) { data.log = data.log.filter((l) => l.id !== r.id); logIds.delete(r.id); changed = true; }
        data.tomb[r.id] = { kind: 'log', u: r.u };
      } else if (!logIds.has(r.id) && !data.tomb[r.id]) {
        data.log.push({ id: r.id, t: r.t, cardId: r.cardId, knew: r.knew }); logIds.add(r.id); changed = true;
      }
      continue;
    }
    const list = { deck: 'decks', card: 'cards', folder: 'folders' }[r.kind];
    if (!list) continue;                         // type inconnu (version plus récente) : ignoré
    const local = data[list].find((x) => x.id === r.id), tomb = data.tomb[r.id];
    const localU = local ? local.u : tomb ? tomb.u : -1;
    seen[r.id] = r.u;
    if (localU >= r.u) continue;                 // la version d'ici est aussi récente ou plus récente : elle sera renvoyée
    if (r.deleted) { if (local) data[list] = data[list].filter((x) => x.id !== r.id); data.tomb[r.id] = { kind: r.kind, u: r.u }; }
    else {
      const { kind, deleted, ...rest } = r;
      data[list] = local ? data[list].map((x) => (x.id === r.id ? rest : x)) : [...data[list], rest];
      delete data.tomb[r.id];
    }
    changed = true;
  }
  if (changed) { data.log.sort((a, b) => a.t - b.t); if (data.log.length > 5000) data.log = data.log.slice(-5000); }
  return changed;
}

async function syncNow() {
  if (!remote || !syncUser) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; setSync('sync');
  try {
    const out = dirtyItems();
    if (out.length) await remote.push(syncUser.uid, out);
    for (const it of out) syncSt.seen[it.id] = it.kind === 'log' && !it.deleted ? true : it.u;
    const { items, cursor } = await remote.pull(syncUser.uid, syncSt.cursor);
    const changed = mergeIn(items);
    syncSt.cursor = Math.max(syncSt.cursor, cursor); syncSt.last = Date.now();
    if (changed) { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
    saveSt(); setSync('ok');
    if (dirtyItems().length) syncAgain = true;     // une version d'ici plus récente que celle du serveur : on la renvoie aussitôt
    if (changed && !ui.review && !modalOpen() && !typing()) render();
  } catch (e) { setSync('err', e); }
  finally { syncing = false; if (syncAgain) { syncAgain = false; scheduleSync(800); } }
}
function scheduleSync(ms = 3000) { if (!remote || !syncUser) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, ms); }

function authMsg(e) {
  const c = ((e && e.code) || '').replace('firestore/', '');
  const m = {
    'auth/invalid-credential': 'Email ou mot de passe incorrect.', 'auth/wrong-password': 'Email ou mot de passe incorrect.',
    'auth/user-not-found': 'Email ou mot de passe incorrect.', 'auth/invalid-email': 'Adresse email invalide.',
    'auth/email-already-in-use': 'Un compte existe déjà avec cet email : clique sur « Se connecter ».',
    'auth/weak-password': 'Mot de passe trop court (6 caractères minimum).',
    'auth/too-many-requests': 'Trop d’essais : réessaie dans quelques minutes.',
    'auth/network-request-failed': 'Pas de connexion internet.', 'unavailable': 'Serveur injoignable pour le moment.',
    'permission-denied': 'Accès refusé par la base : vérifie les règles de sécurité.',
  };
  return m[c] || (e && e.message) || 'Erreur inconnue.';
}
function syncLabel() { return !syncOn() || !syncUser ? '' : ({ sync: '☁ synchro…', ok: '☁ synchronisé', err: '☁ hors ligne' }[syncStatus] || '☁'); }
function setSync(state, e) {
  syncStatus = state; syncMsg = e ? authMsg(e) : '';
  const el = $('#syncstat'); if (el) el.textContent = syncLabel();
  refreshBox();
}
function refreshBox() { const box = $('#syncbox'); if (box && !typing()) box.innerHTML = syncBox(); }
function syncBox() {
  if (!syncOn()) return '<p class="muted" style="margin:0">Synchronisation pas encore activée. Une fois ton compte en ligne créé (voir le guide), tu retrouveras les mêmes cartes sur le téléphone et sur le PC.</p>';
  if (!remote) return `<p class="muted" style="margin:0">${syncStatus === 'loading' ? 'Chargement…' : 'Synchronisation indisponible pour le moment (hors connexion ?). Elle reprendra automatiquement.'}</p>`;
  if (!syncUser) return `<p class="muted" style="margin:0 0 6px">Connecte-toi avec le même compte sur tous tes appareils pour retrouver les mêmes cartes. Tes cartes actuelles seront ajoutées à celles du compte.</p>
    <label class="lab" for="s-email">Email</label><input class="inp" id="s-email" type="email" autocomplete="email">
    <label class="lab" for="s-pass">Mot de passe (6 caractères minimum)</label><input class="inp" id="s-pass" type="password" autocomplete="current-password">
    <div class="btnrow"><button class="primary" data-act="sync-login">Se connecter</button><button class="ghost" data-act="sync-signup">Créer un compte</button><button class="link" data-act="sync-reset">Mot de passe oublié</button></div>
    ${syncMsg ? `<p class="err">${esc(syncMsg)}</p>` : ''}`;
  const last = syncSt && syncSt.last ? `Dernière synchronisation : il y a ${formatAgo(syncSt.last, now())}.` : 'Pas encore synchronisé.';
  return `<p style="margin:0">Connecté : <b>${esc(syncUser.email || '')}</b></p>
    <p class="muted" style="margin:6px 0 0">${syncStatus === 'err' ? '⚠ ' + esc(syncMsg || 'Synchronisation impossible pour le moment.') : syncStatus === 'sync' ? 'Synchronisation en cours…' : last}</p>
    <div class="btnrow"><button class="primary" data-act="sync-now">Synchroniser maintenant</button><button class="ghost" data-act="sync-logout">Se déconnecter</button></div>`;
}
async function doAuth(kind) {
  const email = (($('#s-email') || {}).value || '').trim(), pass = ($('#s-pass') || {}).value || '';
  if (!remote) return;
  if (!email || !pass) { syncMsg = 'Entre ton email et ton mot de passe.'; return refreshBoxForce(); }
  syncMsg = 'Connexion…'; refreshBoxForce();
  try { await (kind === 'signup' ? remote.signUp(email, pass) : remote.signIn(email, pass)); }
  catch (e) { syncMsg = authMsg(e); refreshBoxForce(); }
}
async function doReset() {
  const email = (($('#s-email') || {}).value || '').trim();
  if (!remote) return;
  if (!email) { syncMsg = 'Entre ton email, puis clique sur « Mot de passe oublié ».'; return refreshBoxForce(); }
  try { await remote.reset(email); syncMsg = 'Email de réinitialisation envoyé (pense à regarder les courriers indésirables).'; }
  catch (e) { syncMsg = authMsg(e); }
  refreshBoxForce();
}
// Réaffiche la zone de connexion en gardant ce que l'utilisateur a tapé.
function refreshBoxForce() {
  const box = $('#syncbox'); if (!box) return;
  const e = ($('#s-email') || {}).value || '', p = ($('#s-pass') || {}).value || '';
  box.innerHTML = syncBox();
  if ($('#s-email')) $('#s-email').value = e; if ($('#s-pass')) $('#s-pass').value = p;
}
function onAuth(u) {
  syncUser = u; syncMsg = '';
  if (u) { syncSt = loadSt(u.uid); setSync('sync'); syncNow(); } else { syncSt = null; setSync('idle'); }
  if (!ui.review && !modalOpen()) render();
}
async function initSync() {
  if (!syncOn() || remote) return;
  try { syncStatus = 'loading'; remote = await (window.__REMOTE_FACTORY__ || firebaseRemote)(FIREBASE_CONFIG); remote.onAuth(onAuth); }
  catch (e) { remote = null; syncStatus = 'err'; }
  refreshBox();
}
window.addEventListener('online', () => (remote ? scheduleSync(500) : initSync()));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') (remote ? scheduleSync(300) : initSync()); });
setInterval(() => scheduleSync(0), 5 * 60 * 1000);

setInterval(() => { if (!ui.review && !modalOpen() && !typing()) render(); }, 60000);
render();
initSync();
</script>
